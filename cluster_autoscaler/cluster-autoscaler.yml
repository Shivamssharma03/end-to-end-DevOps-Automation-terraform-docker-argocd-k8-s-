##############################################
# 1. SERVICE ACCOUNT (IDENTITY INSIDE K8S)
##############################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system

  ###############################################################
  # IAM ROLE ANNOTATION (VERY IMPORTANT FOR EKS!)
  # This tells Kubernetes:
  # "Use this AWS IAM role when this ServiceAccount runs"
  #
  # AUTOSCALER NEEDS NODE ROLE PERMISSIONS TO SCALE EC2 INSTANCES
  ###############################################################
  annotations:
    eks.amazonaws.com/role-arn: <NODE_ROLE_ARN>  ### enter the output of the node arn here before apply 
---
##############################################
# 2. CLUSTER ROLE (PERMISSIONS in Kubernetes)
##############################################
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  ###############################################################
  # Autoscaler needs permissions to:
  # - Read nodes
  # - Watch pods
  # - Update node status
  # - Create evictions
  # - Read deployments, replicasets, jobs
  ###############################################################
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]

  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]

  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "update"]

  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]

  - apiGroups: [""]
    resources: ["pods", "services", "replicationcontrollers", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["watch", "list", "get"]

  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "deployments"]
    verbs: ["watch", "list", "get"]

---
##################################################
# 3. CLUSTER ROLE BINDING (CONNECTS ROLE + SA)
##################################################
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler

subjects:
  ##############################################################
  # Bind the ClusterRole to the ServiceAccount
  ##############################################################
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
##############################################
# 4. DEPLOYMENT (RUNNING THE AUTOSCALER)
##############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler

      ##############################################################
      # Prevent eviction of autoscaler pod
      ##############################################################
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

    spec:
      ##############################################################
      # The ServiceAccount used for IAM role + RBAC
      ##############################################################
      serviceAccountName: cluster-autoscaler

      containers:
      - name: cluster-autoscaler
        image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.29.0

        ##############################################################
        # Autoscaler startup commands
        ##############################################################
        command:
          - ./cluster-autoscaler
          - --v=4
          - --cluster-name=eks-pvt-cluster
          - --balance-similar-node-groups
          - --skip-nodes-with-local-storage=false
          - --skip-nodes-with-system-pods=false

        ##############################################################
        # AWS REGION (required)
        ##############################################################
        env:
        - name: AWS_REGION
          value: eu-north-1
